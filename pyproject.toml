[project]
name = "garmin-mcp-server"
version = "0.1.0"
description = "Read-only MCP server for your own Garmin Connect data via the Garmin Personal API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]
